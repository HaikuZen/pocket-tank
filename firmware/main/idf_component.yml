dependencies:
  idf: ">=5.4"
  espressif/esp_lcd_sh8601: "^2.0"
  espressif/esp_lcd_touch_ft5x06: "^1.1"
  espressif/esp_lcd_touch_cst816s: "^1.0"
  espressif/esp_lcd_touch_gt911: "^1.1"   # the Freenove FNK0115
  # the Elecrow CrowPanel P4 (only for an esp32p4 build): its EK79007 MIPI-DSI
  # panel, and Wi-Fi through the onboard ESP32-C6 over SDIO. esp_hosted 2.12.x:
  # 3.x wants IDF 5.5, and Elecrow's C6 slave firmware is 2.12.3;
  # esp_wifi_remote 1.6.3 is the last to keep esp_hosted < 3.0
  espressif/esp_lcd_ek79007:
    version: "~1.0.4"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: "~2.12.3"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.3"
    rules:
      - if: "target == esp32p4"
